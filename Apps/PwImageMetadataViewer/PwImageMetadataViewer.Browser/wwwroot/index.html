<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Pointless Waymarks Image Metadata Viewer</title>
    <meta name="author" content="Charles Miles">
    <meta name="description" content="Pointless Waymarks Image Metadata Viewer">
    <meta name="application-name" content="Pointless Waymarks Image Metadata Viewer">
    <meta name="copyright" content="©2026 Charles Miles">
    <base href="/PwImageMetadataViewer/" />
    <script>
        (function () {
            if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                if (!window.location.pathname.startsWith('/PwImageMetadataViewer')) {
                    const baseEl = document.querySelector('base');
                    if (baseEl) baseEl.setAttribute('href', '/');
                }
            }
        })();
    </script>
    <link rel="icon" href="favicon.ico" type="image/x-icon" />
    <script>
        (function () {
            const style = document.createElement('link');
            style.setAttribute('rel', 'stylesheet');
            style.setAttribute('type', 'text/css');
            style.setAttribute('href', 'loading-indicator.css?date=' + new Date().toISOString());
            document.head.appendChild(style);
        })();
    </script>
    <!-- 1. Leaflet Core CSS -->
    <link rel="stylesheet" href="applibs/leaflet/leaflet.css" />

    <!-- 2. Leaflet Gesture Handling CSS -->
    <link rel="stylesheet" href="applibs/leaflet-gesture-handling.min.css" />

    <!-- 3. Leaflet Locate Control CSS -->
    <link rel="stylesheet" href="applibs/L.Control.Locate.min.css" />

    <!-- App Custom Styles -->
    <link rel="stylesheet" href="css/pw-viewer.css" />

    <!-- 4. Leaflet Core Script -->
    <script src="applibs/leaflet/leaflet.js"></script>

    <!-- 5. Leaflet Gesture Handling Script (Must be after leaflet.js) -->
    <script src="applibs/leaflet-gesture-handling.min.js"></script>

    <!-- 6. Leaflet Locate Control Script (Must be after leaflet.js) -->
    <script src="applibs/L.Control.Locate.min.js"></script>

    <!-- ExifTool & OpenSilver Bridge -->
    <script src="js/pw-image-viewer.js"></script>
</head>
<body>
    <div id="app">
        <div class="loading-indicator-wrapper">
            <div class="loading-indicator">
                <div class="loading-indicator-ball"></div>
                <div class="loading-indicator-ball"></div>
                <div class="loading-indicator-ball"></div>
                <div class="loading-indicator-ball"></div>
                <div class="loading-indicator-ball"></div>
                <div class="loading-indicator-ball"></div>
                <div class="loading-indicator-ball"></div>
                <div class="loading-indicator-ball"></div>
                <div class="loading-indicator-ball"></div>
                <div class="loading-indicator-ball"></div>
                <div class="loading-indicator-ball"></div>
                <div class="loading-indicator-ball"></div>
                <div class="loading-indicator-ball"></div>
                <div class="loading-indicator-ball"></div>
                <div class="loading-indicator-ball"></div>
                <div class="loading-indicator-ball"></div>
                <div class="loading-indicator-text"></div>
            </div>
        </div>
    </div>
    <div id="opensilver-root" style="position: relative; width: 100%; height: 100%; overflow-x: hidden; overflow-y: hidden"></div>

    <script>
        (function () {
            const script = document.createElement('script');
            script.setAttribute('type', 'application/javascript');
            script.setAttribute('src', 'libs/OpenSilver.js?date=' + new Date().toISOString());
            script.addEventListener('load', function () {
                const scriptWebAssembly = document.createElement('script');
                scriptWebAssembly.setAttribute('type', 'application/javascript');
                scriptWebAssembly.setAttribute('src', '_framework/blazor.webassembly.js?date=' + new Date().toISOString());
                document.body.appendChild(scriptWebAssembly);
            });
            document.body.appendChild(script);
        })();
    </script>
</body>
</html>
